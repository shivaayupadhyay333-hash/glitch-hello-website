<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eicher Sure Liquidation App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #e31837; font-weight: 800; margin-bottom: 5px; }
        h4 { text-align: center; color: #555; margin-top: 0px; margin-bottom: 25px; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #333; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 14px; background-color: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #128C7E; }
    </style>
</head>
<body>

<div class="container">
    <h2>Eicher Sure Liquidation</h2>
    <h4>Managed by Shivansh Upadhyay</h4>
    
    <label for="model">Truck Model</label>
    <input type="text" id="model" placeholder="Ex: Eicher Pro 2049" required>
    
    <label for="year">Manufacturing Year</label>
    <input type="number" id="year" placeholder="Ex: 2019" required>
    
    <label for="kms">KMs Driven</label>
    <input type="text" id="kms" placeholder="Ex: 85,000" required>
    
    <label for="price">Expected Price (₹)</label>
    <input type="text" id="price" placeholder="Ex: 6,50,000" required>
    
    <label for="remarks">Condition / Remarks</label>
    <input type="text" id="remarks" placeholder="Ex: Good condition, valid papers">
    
    <button onclick="shareDetails()">Share Details 🚀</button>
</div>

<script>
    function shareDetails() {
        // Form se details lena
        const model = document.getElementById('model').value;
        const year = document.getElementById('year').value;
        const kms = document.getElementById('kms').value;
        const price = document.getElementById('price').value;
        const remarks = document.getElementById('remarks').value;

        // Validation: Check karna ki zaruri details bhari hain ya nahi
        if(!model || !year || !price) {
            alert("Kripya Model, Year aur Price zaroor bharein!");
            return;
        }

        // WhatsApp / Facebook ke liye attractive message format tayar karna
        const message = `🚚 *FOR SALE: USED COMMERCIAL VEHICLE* 🚚\n\n` +
                        `🔹 *Model:* ${model}\n` +
                        `📅 *Year:* ${year}\n` +
                        `🛣️ *KMs Driven:* ${kms}\n` +
                        `💰 *Price:* ₹${price}\n` +
                        `📝 *Remarks:* ${remarks}\n\n` +
                        `📞 Contact for deal and more details!`;

        // Mobile ka asli Share Menu kholna
        if (navigator.share) {
            navigator.share({
                title: 'Used Truck For Sale',
                text: message
            }).then(() => {
                console.log('Details shared successfully!');
            }).catch(console.error);
        } else {
            // Agar laptop/computer par use kar rahe hain jahan share menu nahi hota
            navigator.clipboard.writeText(message);
            alert("Details copy ho gayi hain! Aap ise ab WhatsApp ya Facebook par paste kar sakte hain.");
        }
    }
</script>

</body>
</html>
